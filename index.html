*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0806;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;

canvas{display:block;position:absolute;top:0;left:0;width:100%;height:100%}

/* HUD overlay */
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;

#score-area{text-align:left}

#score-value{font-size:28px;font-weight:900;color:#f0d080;text-shadow:0 0 12px rgba(240,208,128,.4)}
#combo-area{text-align:center}
#combo-value{font-size:32px;font-weight:900;color:#e84040;text-shadow:0 0 16px rgba(232,64,64,.5);

#combo-label{font-size:11px;color:#c06040}
#acc-area{text-align:right}
#acc-value{font-size:20px;font-weight:700;color:#d0c8b0}
#acc-label{font-size:11px;color:#a09070}

/* Judgment popup */
#judgment{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);
  font-size:48px;font-weight:900;pointer-events:none;z-index:20;
  opacity:0;transition:none;text-shadow:0 0 20px currentColor}
.judge-perfect{color:#ffd700;animation:judgePop .6s ease-out forwards}
.judge-good{color:#ff8c00;animation:judgePop .6s ease-out forwards}
.judge-miss{color:#808080;animation:judgePop .6s ease-out forwards}
@keyframes judgePop{0%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}

#start-screen .subtitle{color:#a09070;font-size:14px;margin-bottom:32px;letter-spacing:2px}
#start-screen .key-hint{display:flex;gap:16px;margin-bottom:24px}

// ==================== AUDIO ENGINE: 中国大鼓音色 ====================
let audioCtx;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  document.getElementById("loading").style.display = "none";
  document.getElementById("start-screen").style.display = "flex";
}

// 咚 (Don) — 中国大鼓中心击打
function playDon(time) {
  if (!audioCtx) return;
  const t = time || audioCtx.currentTime;

  // Layer 1: 低频正弦 — 大鼓的深沉共鸣
  const osc1 = audioCtx.createOscillator();
  const gain1 = audioCtx.createGain();
  osc1.type = "sine";
  osc1.frequency.setValueAtTime(140, t);
  osc1.frequency.exponentialRampToValueAtTime(55, t + 0.08); // 快速下沉
  osc1.frequency.setValueAtTime(55, t + 1.2);
  gain1.gain.setValueAtTime(0.9, t);
  gain1.gain.exponentialRampToValueAtTime(0.001, t + 1.5);
  osc1.connect(gain1); gain1.connect(audioCtx.destination);
  osc1.start(t); osc1.stop(t + 1.6);

  // Layer 2: 三角波 — 增加鼓皮的"皮感"
  const osc2 = audioCtx.createOscillator();
  const gain2 = audioCtx.createGain();
  osc2.type = "triangle";
  osc2.frequency.setValueAtTime(200, t);
  osc2.frequency.exponentialRampToValueAtTime(90, t + 0.05);
  gain2.gain.setValueAtTime(0.4, t);
  gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
  osc2.connect(gain2); gain2.connect(audioCtx.destination);
  osc2.start(t); osc2.stop(t + 0.7);

  // Layer 3: 白噪声冲击 — 鼓槌击打瞬间
  const bufferSize = audioCtx.sampleRate * 0.04;
  const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = noiseBuffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.005));
  }
  const noise = audioCtx.createBufferSource();
  const gainN = audioCtx.createGain();
  noise.buffer = noiseBuffer;
  gainN.gain.setValueAtTime(0.5, t);
  gainN.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
  noise.connect(gainN); gainN.connect(audioCtx.destination);
  noise.start(t);

  // Layer 4: 低频谐振 — 大鼓的"瓮声"
  const osc3 = audioCtx.createOscillator();
  const gain3 = audioCtx.createGain();
  osc3.type = "sine";
  osc3.frequency.value = 35;
  gain3.gain.setValueAtTime(0.25, t + 0.02);
  gain3.gain.exponentialRampToValueAtTime(0.001, t + 2.0);
  osc3.connect(gain3); gain3.connect(audioCtx.destination);
  osc3.start(t + 0.02); osc3.stop(t + 2.1);
}

// 咔 (Ka) — 鼓边击打
function playKa(time) {
  if (!audioCtx) return;
  const t = time || audioCtx.currentTime;

  // Layer 1: 高频短促 — 边击的清脆感
  const osc1 = audioCtx.createOscillator();
  const gain1 = audioCtx.createGain();
  osc1.type = "square";
  osc1.frequency.setValueAtTime(600, t);
  osc1.frequency.exponentialRampToValueAtTime(300, t + 0.03);
  gain1.gain.setValueAtTime(0.35, t);
  gain1.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
  osc1.connect(gain1); gain1.connect(audioCtx.destination);
  osc1.start(t); osc1.stop(t + 0.2);

  // Layer 2: 噪声层 — 鼓边木质感
  const bufferSize = audioCtx.sampleRate * 0.06;
  const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const nd = noiseBuffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    nd[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.003));
  }
  const noise = audioCtx.createBufferSource();
  const gainN = audioCtx.createGain();
  noise.buffer = noiseBuffer;
  gainN.gain.setValueAtTime(0.45, t);
  gainN.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
  const filter = audioCtx.createBiquadFilter();
  filter.type = "highpass"; filter.frequency.value = 2000;
  noise.connect(filter); filter.connect(gainN); gainN.connect(audioCtx.destination);
  noise.start(t);

  // Layer 3: 高频泛音
  const osc2 = audioCtx.createOscillator();
  const gain2 = audioCtx.createGain();
  osc2.type = "sine";
  osc2.frequency.value = 3200;
  gain2.gain.setValueAtTime(0.12, t);
  gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
  osc2.connect(gain2); gain2.connect(audioCtx.destination);
  osc2.start(t); osc2.stop(t + 0.05);
}

// ==================== DEMO SONG ====================
// 简易版"将军令"风格节奏
// ==================== SONG LIBRARY ====================
// 辅助：按给定节奏模式生成音符
// pattern: "D"=don, "K"=ka, "."=休止, 每字符=1/8拍
function generateNotes(startBeat, pattern, bpm) {
  const beatLen = (60 / bpm) / 2; // each char = 1/8 beat = half a quarter
  const notes = [];
  for (let i = 0; i < pattern.length; i++) {
    const ch = pattern[i];
    if (ch === "D") notes.push({ t: startBeat * (60/bpm) + i * beatLen, type: "don" });
    else if (ch === "K") notes.push({ t: startBeat * (60/bpm) + i * beatLen, type: "ka" });
  }
  return notes;
}
// repeat pattern n times sequentially
function repeatPattern(startBeat, pattern, bpm, times) {
  const all = [];
  const barsPerRepeat = pattern.length / 8; // 8 chars = 1 bar of 4/4
  for (let i = 0; i < times; i++) {
    all.push(...generateNotes(startBeat + i * barsPerRepeat * 4, pattern, bpm));
  }
  return all;
}

// ==================== RHYTHM ENGINE ====================
class RhythmEngine {
  constructor(callbacks = {}) {
    this._song = null;
    this._notes = [];
    this._noteIndex = 0;
    this._score = 0;
    this._combo = 0;
    this._maxCombo = 0;
    this._perfects = 0;
    this._goods = 0;
    this._misses = 0;
    this._totalJudged = 0;
    this._state = "idle";    // idle | playing | paused | ended
    this._startTime = 0;     // wall-clock ref point — NEVER modified after start()
    this._elapsed = 0;       // musical position in seconds
    this._pauseOffset = 0;   // accumulated pause time — only incremented
    this._pauseStart = 0;    // wall-clock when pause began
    this._timerId = null;
    this._autoId = null;
    this._countdown = 0;

    // Timing windows (ms)
    this.perfectWindow = 60;
    this.goodWindow = 140;

    // Callbacks
    this._cb = callbacks;
  }

  // ---- Read-only accessors ----
  get state() { return this._state; }
  get song() { return this._song; }
  get notes() { return this._notes; }
  get noteIndex() { return this._noteIndex; }
  get score() { return this._score; }
  get combo() { return this._combo; }
  get maxCombo() { return this._maxCombo; }
  get perfects() { return this._perfects; }
  get goods() { return this._goods; }
  get misses() { return this._misses; }
  get totalNotes() { return this._notes.filter(n => n.time <= (this._song ? this._song.duration : 0)).length; }
  get accuracy() {
    const t = this.totalNotes;
    return t > 0 ? (this._perfects + this._goods * 0.5) / t : 0;
  }
  get elapsed() { return this._elapsed; }
  get isPlaying() { return this._state === "playing"; }
  get isFinished() { return this._state === "ended"; }

  // ---- Lifecycle ----
  load(songData) {
    this._song = songData;
    this._notes = songData.notes
      .map(n => ({ ...n, judged: false, played: false }))
      .sort((a, b) => a.t - b.t);
    this.reset();
  }

  start(countdownSec = 2) {
    if (!this._song || this._state === "playing") return;
    this.reset();
    this._countdown = countdownSec;
    this._startTime = performance.now() / 1000 + countdownSec;
    this._state = "playing";
    this._emit("start");
    this._tick(performance.now());
  }

  reset() {
    this._stopTimer();
    this._score = 0; this._combo = 0; this._maxCombo = 0;
    this._perfects = 0; this._goods = 0; this._misses = 0;
    this._totalJudged = 0; this._noteIndex = 0;
    this._elapsed = 0; this._countdown = 0;
    this._pauseOffset = 0; this._pauseStart = 0;
    this._notes.forEach(n => { n.judged = false; n.played = false; });
  }

  stop() {
    this._stopTimer();
    this._state = "idle";
    this._emit("stop");
  }

  pause() {
    if (this._state !== "playing") return;
    this._state = "paused";
    this._pauseStart = performance.now() / 1000;
    this._stopTimer();
    this._emit("pause");
  }

  resume() {
    if (this._state !== "paused") return;
    // Increment pause offset — _startTime NEVER changes
    this._pauseOffset += performance.now() / 1000 - this._pauseStart;
    this._state = "playing";
    this._emit("resume");
    this._tick(performance.now());
  }

  _stopTimer() {
    if (this._timerId) { cancelAnimationFrame(this._timerId); this._timerId = null; }
    if (this._autoId) { clearTimeout(this._autoId); this._autoId = null; }
  }

  _tick(now) {
    if (this._state !== "playing") return;
    // Musical position = wall-clock - reference-point - accumulated-pauses
    // _startTime is immutable after start(); _pauseOffset is only incremented
    this._elapsed = now / 1000 - this._startTime - this._pauseOffset;
    if (this._elapsed < 0) this._elapsed = 0;

    // Auto-judge passed notes
    while (this._noteIndex < this._notes.length && this._notes[this._noteIndex].time <= this._elapsed) {
      const n = this._notes[this._noteIndex];
      if (!n.judged) {
        n.judged = true;
        this._misses++;
        this._combo = 0;
        this._emit("miss", { note: n, reason: "auto" });
        this._emit("comboChange");
        // Play sound late so player hears the miss
        if (!n.played) { n.played = true; this._emit("playNote", n); }
      }
      this._noteIndex++;
    }

    // Check end
    if (this._elapsed > (this._song.duration + 1)) {
      this._finish();
      return;
    }

    this._emit("tick", { elapsed: this._elapsed });
    this._timerId = requestAnimationFrame(t => this._tick(t));
  }

  _finish() {
    this._stopTimer();
    this._state = "ended";
    // Auto-judge remaining
    for (const n of this._notes) {
      if (!n.judged && n.time <= this._song.duration) {
        n.judged = true; this._misses++;
      }
    }
    this._emit("complete", {
      score: this._score, combo: this._maxCombo,
      perfects: this._perfects, goods: this._goods, misses: this._misses,
      accuracy: this.accuracy
    });
  }

  // ---- Input ----
  hit(type) {
    if (this._state !== "playing") return null;

    let bestNote = null;
    let bestDist = Infinity;

    for (let i = this._noteIndex; i < Math.min(this._noteIndex + 10, this._notes.length); i++) {
      const n = this._notes[i];
      if (n.judged || n.type !== type) continue;
      const dist = Math.abs(n.time - this._elapsed) * 1000;
      if (dist < bestDist && dist < this.goodWindow + 40) {
        bestDist = dist; bestNote = n;
      }
    }

    if (!bestNote) {
      this._combo = 0;
      this._emit("comboChange");
      return { result: "whiff" };
    }

    bestNote.judged = true;
    const dist = Math.abs(bestNote.time - this._elapsed) * 1000;
    let result;

    if (dist <= this.perfectWindow) {
      this._score += 300 + Math.floor(this._combo * 0.5);
      this._combo++; this._perfects++;
      result = "perfect";
    } else if (dist <= this.goodWindow) {
      this._score += 150 + Math.floor(this._combo * 0.3);
      this._combo++; this._goods++;
      result = "good";
    } else {
      this._combo = 0; this._misses++;
      result = "miss";
    }

    if (this._combo > this._maxCombo) this._maxCombo = this._combo;
    if (!bestNote.played) { bestNote.played = true; this._emit("playNote", bestNote); }
    this._emit("judgment", { result, note: bestNote, combo: this._combo, dist });
    this._emit("comboChange");
    return { result, note: bestNote, combo: this._combo, dist };
  }

  // ---- Get upcoming notes for rendering ----
  getVisibleNotes(lookBehindSec = 0.2, lookAheadSec = 5) {
    const start = this._elapsed - lookBehindSec;
    const end = this._elapsed + lookAheadSec;
    const visible = [];
    for (let i = Math.max(0, this._noteIndex - 4); i < this._notes.length; i++) {
      const n = this._notes[i];
      if (n.time < start) continue;
      if (n.time > end) break;
      visible.push(n);
    }
    return visible;
  }

  // ---- Events ----
  _emit(event, data) {
    if (this._cb[event]) this._cb[event](data);
  }
}

// ==================== GAME STATE ====================
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// Create engine with callbacks wired to game UI + audio
const engine = new RhythmEngine({
  playNote(n) {
    if (!audioCtx) return;
    if (n.type === "don") playDon(audioCtx.currentTime + 0.01);
    else playKa(audioCtx.currentTime + 0.01);
  },
  judgment(data) {
    if (data.result === "perfect") { drumFlash = 0.2; drumShake = 8; showJudgment("良", "judge-perfect"); }
    else if (data.result === "good") { drumFlash = 0.1; drumShake = 4; showJudgment("可", "judge-good"); }
    else { showJudgment("不可", "judge-miss"); }
  },
  miss(data) { showJudgment("不可", "judge-miss"); },
  comboChange() { updateCombo(); },
  tick() { updateScore(); },
  complete(data) { endGame(data); }
});

let animFrameId = null;

// Visual
let drumShake = 0;
let drumFlash = 0;

// Lane constants
const HIT_X = 0.22;
const NOTE_SPEED_FACTOR = 220;

// ==================== INPUT ====================
function handleDon() { engine.hit("don"); }
function handleKa() { engine.hit("ka"); }

// Touch input
canvas.addEventListener("touchstart", e => {
  e.preventDefault();
  initAudio();
  for (const t of e.changedTouches) {
    const x = t.clientX / window.innerWidth;
    if (x < 0.5) handleDon(); else handleKa();
  }
}, {passive: false});

// Keyboard input
window.addEventListener("keydown", e => {
  if (e.repeat) return;
  initAudio();
  switch(e.key.toLowerCase()) {
    case "d": case "f": handleDon(); break;
    case "j": case "k": handleKa(); break;
    case " ": e.preventDefault(); break;
  }
});

// Click to start on desktop
canvas.addEventListener("click", initAudio);

// ==================== VOICE INPUT (glasses/watch) ====================
let voiceRecog = null;
let glassesMode = false;

function detectGlasses() {
  const w = Math.min(window.innerWidth, screen.width || 9999);
  const h = Math.min(window.innerHeight, screen.height || 9999);
  // Smart glasses typically have narrow aspect ratios (e.g. 640x400)
  glassesMode = (w <= 420 && h <= 340) || (w <= 340 && h <= 420);
  if (glassesMode) { startVoiceInput(); }
  return glassesMode;
}

function startVoiceInput() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  try {
    voiceRecog = new SR();
    voiceRecog.lang = "zh-CN";
    voiceRecog.continuous = true;
    voiceRecog.interimResults = false;
    voiceRecog.onresult = (e) => {
      const txt = e.results[e.results.length-1][0].transcript.trim();
      if (/咚|don|东|动|通/i.test(txt)) { handleDon(); }
      else if (/咔|ka|卡|咖|擦/i.test(txt)) { handleKa(); }
    };
    voiceRecog.onerror = () => {}; // silently retry
    voiceRecog.onend = () => { if (glassesMode) voiceRecog.start(); };
    voiceRecog.start();
    document.getElementById("voice-mode-bar").classList.add("show");
  } catch(e) {}
}

function stopVoiceInput() {
  if (voiceRecog) { try { voiceRecog.stop(); } catch(e) {}; voiceRecog = null; }
  document.getElementById("voice-mode-bar").classList.remove("show");
}

// ==================== SMART RING INPUT (DeviceOrientation) ====================
let ringActive = false;
let ringBeta = 0, ringGamma = 0;
let ringFrameCount = 0;
const RING_THROTTLE = 8;
const RING_TILT_THRESH = 5;
const RING_SHAKE_THRESH = 20;

function initRing() {
  if (typeof DeviceOrientationEvent === 'undefined') return;
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    document.addEventListener('click', function ringPerm() {
      DeviceOrientationEvent.requestPermission()
        .then(state => { if (state === 'granted') startRing(); })
        .catch(() => {});
    }, { once: true });
  } else {
    startRing();
  }
}

function startRing() {
  ringActive = true;
  window.addEventListener('deviceorientation', onRingOrientation);
}

function onRingOrientation(e) {
  if (!ringActive) return;
  ringFrameCount++;
  if (ringFrameCount % RING_THROTTLE !== 0) return;
  const beta = e.beta || 0, gamma = e.gamma || 0;
  const dBeta = beta - ringBeta, dGamma = gamma - ringGamma;
  ringBeta = beta; ringGamma = gamma;
  if (Math.abs(dBeta) > RING_SHAKE_THRESH || Math.abs(dGamma) > RING_SHAKE_THRESH) {
    handleDon(); return;
  }
  if (dBeta < -RING_TILT_THRESH) { handleDon(); }
  else if (dBeta > RING_TILT_THRESH) { handleDon(); }
  else if (dGamma < -RING_TILT_THRESH) { handleKa(); }
  else if (dGamma > RING_TILT_THRESH) { handleKa(); }
}

// ==================== SMART CANE INPUT (DeviceMotion) ====================
let caneActive = false;
let caneFrameCount = 0;
const CANE_THROTTLE = 6;
const CANE_TAP_THRESH = 8;
const CANE_SWING_THRESH = 3;

function initCane() {
  if (typeof DeviceMotionEvent === 'undefined') return;
  if (typeof DeviceMotionEvent.requestPermission === 'function') {
    document.addEventListener('click', function canePerm() {
      DeviceMotionEvent.requestPermission()
        .then(state => { if (state === 'granted') startCane(); })
        .catch(() => {});
    }, { once: true });
  } else {
    startCane();
  }
}

function startCane() {
  caneActive = true;
  window.addEventListener('devicemotion', onCaneMotion);
}

function onCaneMotion(e) {
  if (!caneActive) return;
  caneFrameCount++;
  if (caneFrameCount % CANE_THROTTLE !== 0) return;
  const acc = e.accelerationIncludingGravity || e.acceleration || {};
  const ax = acc.x || 0, ay = acc.y || 0, az = acc.z || 0;
  const dmag = Math.sqrt(ax*ax + ay*ay + az*az);
  if (dmag > CANE_TAP_THRESH) { handleDon(); return; }
  if (Math.abs(ax) > CANE_SWING_THRESH || Math.abs(ay) > CANE_SWING_THRESH) {
    handleKa();
  }
}

// ==================== UI ====================
function showJudgment(text, cls) {
  const el = document.getElementById("judgment");
  el.textContent = text;
  el.className = cls;
  void el.offsetWidth;
  el.className = cls;
  setTimeout(() => { el.className = ""; el.textContent = ""; }, 600);
}

function updateScore() {
  document.getElementById("score-value").textContent = engine.score;
  const t = engine.totalNotes;
  const hit = engine.perfects + engine.goods;
  document.getElementById("acc-value").textContent =
    t > 0 ? Math.round(hit / Math.max(t, hit + engine.misses) * 100) + "%" : "--%";
}

function updateCombo() {
  const el = document.getElementById("combo-value");
  const c = engine.combo;
  el.textContent = c;
  if (c >= 10) {
    el.style.opacity = "1";
    el.style.transform = "scale(1.15)";
    setTimeout(() => el.style.transform = "scale(1)", 80);
  } else if (c > 0) {
    el.style.opacity = "0.7";
  } else {
    el.style.opacity = "0";
  }
}

// ==================== GAME LOOP ====================
function startGame(songId) {
  initAudio();
  const songData = SONGS.find(s => s.id === songId) || SONGS[0];
  engine.load(songData);
  engine.start(2);

  document.getElementById("start-screen").style.display = "none";
  document.getElementById("hud").style.display = "flex";
  document.getElementById("result-screen").classList.remove("show");
  document.getElementById("combo-value").style.opacity = "0";
  updateScore();
  updateCombo();

  resize();
  renderLoop();
}

function restartGame() {
  engine.stop();
  if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }
  document.getElementById("start-screen").style.display = "flex";
  document.getElementById("hud").style.display = "none";
  document.getElementById("result-screen").classList.remove("show");
  document.getElementById("combo-value").style.opacity = "0";
}

function renderLoop() {
  if (engine.isFinished) return;
  // Update visual effects
  if (drumShake > 0) drumShake *= 0.85;
  if (drumFlash > 0) drumFlash *= 0.85;
  render();
  animFrameId = requestAnimationFrame(renderLoop);
}

function endGame(data) {
  if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }
  document.getElementById("hud").style.display = "none";
  const rs = document.getElementById("result-screen");
  rs.classList.add("show");
  document.getElementById("r-perfect").textContent = data.perfects;
  document.getElementById("r-good").textContent = data.goods;
  document.getElementById("r-miss").textContent = data.misses;
  document.getElementById("r-maxcombo").textContent = data.combo;
  document.getElementById("r-score").textContent = data.score;

  const gradeEl = document.getElementById("result-grade");
  if (data.accuracy >= 0.95) gradeEl.textContent = "🥇";
  else if (data.accuracy >= 0.85) gradeEl.textContent = "🥈";
  else if (data.accuracy >= 0.70) gradeEl.textContent = "🥉";
  else gradeEl.textContent = "💪";

  // Final drum hits
  setTimeout(() => playDon(), 200);
  setTimeout(() => playDon(), 500);
  setTimeout(() => playDon(), 800);
}

// ==================== RENDER ====================
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);

function render() {
  const W = canvas.width;
  const H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  const hitX = W * HIT_X;
  const laneY1 = H * 0.28; // don lane
  const laneY2 = H * 0.72; // ka lane
  const laneR = Math.min(W * 0.06, 40);

  // ===== Background =====
  // Subtle gradient
  const bgGrad = ctx.createRadialGradient(W*0.3, H*0.5, 0, W*0.3, H*0.5, W*0.8);
  bgGrad.addColorStop(0, "#1a1410"); bgGrad.addColorStop(1, "#0a0806");
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // ===== Drum flash =====
  if (drumFlash > 0.01) {
    const fg = ctx.createRadialGradient(hitX, H*0.5, 0, hitX, H*0.5, W*0.15);
    fg.addColorStop(0, `rgba(240,200,100,${drumFlash})`);
    fg.addColorStop(1, "rgba(240,200,100,0)");
    ctx.fillStyle = fg; ctx.fillRect(0, 0, W, H);
  }

  // ===== Hit zone line =====
  ctx.strokeStyle = "rgba(200,150,80,0.6)";
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(hitX, 0); ctx.lineTo(hitX, H); ctx.stroke();

  // Hit zone glow
  const glowGrad = ctx.createLinearGradient(hitX - 30, 0, hitX + 30, 0);
  glowGrad.addColorStop(0, "rgba(200,150,80,0)");
  glowGrad.addColorStop(0.5, "rgba(200,150,80,0.15)");
  glowGrad.addColorStop(1, "rgba(200,150,80,0)");
  ctx.fillStyle = glowGrad; ctx.fillRect(hitX - 30, 0, 60, H);

  // ===== Lane indicators =====
  // Don lane (left, upper)
  ctx.strokeStyle = "#d4a03044"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, laneY1); ctx.lineTo(W, laneY1); ctx.stroke();
  ctx.strokeStyle = "#c0604044";
  ctx.beginPath(); ctx.moveTo(0, laneY2); ctx.lineTo(W, laneY2); ctx.stroke();

  // ===== Drum visualization at hit zone =====
  const sx = drumShake ? (Math.random() - 0.5) * drumShake : 0;
  const sy = drumShake ? (Math.random() - 0.5) * drumShake : 0;
  drawDrum(hitX + sx, H*0.5 + sy, laneR * 1.8);

  // ===== Notes =====
  const s = engine.song;
  if (!s) return;
  const beatWidth = NOTE_SPEED_FACTOR * (s.bpm / 120) * (W / 800);
  const now = engine.elapsed;
  const visibleNotes = engine.getVisibleNotes(0.3, 6);

  for (const n of visibleNotes) {
    const x = hitX + (n.time - now) * beatWidth;
    const y = n.type === "don" ? laneY1 : laneY2;
    const r = laneR;
    const alpha = n.judged ? 0.3 : 1;

    ctx.save();
    ctx.globalAlpha = alpha;

    if (n.type === "don") {
      // 咚 — 红色圆 (鼓面)
      const dg = ctx.createRadialGradient(x, y, r*0.2, x, y, r);
      dg.addColorStop(0, "#e84040");
      dg.addColorStop(0.7, "#8b2020");
      dg.addColorStop(1, "#4a1010");
      ctx.fillStyle = dg;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
      // Border
      ctx.strokeStyle = "#ff6060"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.stroke();
      // Inner circle
      ctx.strokeStyle = "#ff909044"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(x, y, r*0.5, 0, Math.PI*2); ctx.stroke();
    } else {
      // 咔 — 蓝色菱形 (鼓边)
      ctx.fillStyle = "#4080e0";
      ctx.strokeStyle = "#6090ff";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x, y - r);
      ctx.lineTo(x + r, y);
      ctx.lineTo(x, y + r);
      ctx.lineTo(x - r, y);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      // Inner diamond
      ctx.strokeStyle = "#80b0ff44"; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x, y - r*0.4);
      ctx.lineTo(x + r*0.4, y);
      ctx.lineTo(x, y + r*0.4);
      ctx.lineTo(x - r*0.4, y);
      ctx.closePath();
      ctx.stroke();
    }

    ctx.restore();
  }

  // ===== Labels at hit zone =====
  ctx.fillStyle = "#d4a03088"; ctx.font = `${Math.max(12, W*0.025)}px "PingFang SC","Microsoft YaHei",sans-serif`;
  ctx.textAlign = "center";
  ctx.fillText("咚", hitX - laneR*2.5, laneY1 + 6);
  ctx.fillStyle = "#6090ff88";
  ctx.fillText("咔", hitX - laneR*2.5, laneY2 + 6);

  // ===== Progress bar =====
  const progY = H - 8;
  const progW = W - 40;
  const progX = 20;
  const pct = s ? Math.min(engine.elapsed / s.duration, 1) : 0;
  ctx.fillStyle = "#2a2018"; ctx.fillRect(progX, progY, progW, 4);
  ctx.fillStyle = "#d4a030"; ctx.fillRect(progX, progY, progW * pct, 4);

  // Title
  ctx.fillStyle = "#a0907066"; ctx.font = `${Math.max(11,W*0.022)}px "PingFang SC","Microsoft YaHei",sans-serif`;
  ctx.textAlign = "right";
  ctx.fillText(s ? s.title : "", W - 20, H - 16);
}

// ==================== DRUM VISUAL ====================
function drawDrum(cx, cy, r) {
  // Drum body (side view ellipse)
  ctx.fillStyle = "#5a3020";
  ctx.beginPath(); ctx.ellipse(cx, cy, r, r*0.5, 0, 0, Math.PI*2); ctx.fill();
  
  // Drum skin (top ellipse, slightly smaller)
  const skinGrad = ctx.createRadialGradient(cx, cy - r*0.05, 0, cx, cy, r);
  skinGrad.addColorStop(0, "#e8d8b8");
  skinGrad.addColorStop(0.6, "#c8a870");
  skinGrad.addColorStop(1, "#8b6030");
  ctx.fillStyle = skinGrad;
  ctx.beginPath(); ctx.ellipse(cx, cy - r*0.1, r*0.85, r*0.4, 0, 0, Math.PI*2); ctx.fill();

  // Drum rim (outer ring, top)
  ctx.strokeStyle = "#a07030"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(cx, cy - r*0.1, r*0.85, r*0.4, 0, 0, Math.PI*2); ctx.stroke();

  // Decorative rivets
  ctx.fillStyle = "#d4a030";
  for (let i = 0; i < 8; i++) {
    const angle = (i / 8) * Math.PI * 2;
    const rx = cx + Math.cos(angle) * r * 0.78;
    const ry = cy - r*0.1 + Math.sin(angle) * r * 0.32;
    ctx.beginPath(); ctx.arc(rx, ry, r*0.06, 0, Math.PI*2); ctx.fill();
  }

  // Side rivets
  ctx.fillStyle = "#c08030";
  for (let i = 0; i < 4; i++) {
    const angle = -Math.PI/2 + (i / 3.5) * Math.PI;
    const rx = cx + Math.cos(angle) * r * 0.9;
    const ry = cy + Math.sin(angle) * r * 0.45;
    ctx.beginPath(); ctx.arc(rx, ry, r*0.04, 0, Math.PI*2); ctx.fill();
  }

  // Chinese character on drum skin
  ctx.fillStyle = "#8b2020"; ctx.font = `${r*0.9}px "STKaiti","KaiTi","PingFang SC",serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("鼓", cx, cy - r*0.1);
}

// ==================== SONG SELECT UI ====================
function buildSongList() {
  const container = document.getElementById("song-list");
  container.innerHTML = "";
  SONGS.forEach(s => {
    const btn = document.createElement("button");
    btn.className = "song-btn";
    btn.innerHTML = `
      <div class="s-left">
        <span class="s-title">${s.title}</span>
        <span class="s-sub">${s.subtitle} · ${s.bpm}BPM · ${Math.round(s.duration)}秒</span>
      </div>
      <div class="s-right">
        <span class="s-diff">${s.difficulty}</span>
        <span class="s-arrow">▶</span>
      </div>`;
    btn.onclick = () => startGame(s.id);
    container.appendChild(btn);
  });
}

// ==================== STARTUP ====================
resize();
detectGlasses();
initRing();
initCane();
buildSongList();
document.getElementById("loading").style.display = "flex";
// Auto-init audio on first interaction is handled by event listeners
// Show start screen after a brief moment
setTimeout(() => {
  document.getElementById("loading").style.display = "none";
  document.getElementById("start-screen").style.display = "flex";
}, 300);
</script>
